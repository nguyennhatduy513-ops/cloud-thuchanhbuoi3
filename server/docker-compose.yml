version: '3.8'

services:
  # Cấu hình cho Backend (Node.js)
  backend:
    build: ./server
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      # Thêm các biến môi trường kết nối database nếu có (ví dụ MongoDB)
    restart: always

